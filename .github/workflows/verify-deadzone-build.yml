name: Verify deadzone app build

on:
  push:
    branches:
      - feature

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/verify-deadzone-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-deadzone-build.yml
          git commit -m "Remove temporary deadzone build workflow [skip ci]"
          git push origin feature
