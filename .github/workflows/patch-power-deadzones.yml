name: Apply power deadzone settings

on:
  push:
    branches: [feature]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature

      - name: Patch settings UI
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/example/powerstation/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''    val powerLimitW: Double?,
    val etaAveragingSeconds: Double?,''',
                  '''    val powerLimitW: Double?,
    val powerStateDeadzoneW: Double?,
    val energyDeadzoneW: Double?,
    val etaAveragingSeconds: Double?,'''
              ),
              (
                  '''            "powerLimitW" -> return range(20.0, 300.0)
            "lowCutVoltageV" -> return range(8.0, 12.0)''',
                  '''            "powerLimitW" -> return range(20.0, 300.0)
            "powerStateDeadzoneW" -> return range(0.0, 20.0)
            "energyDeadzoneW" -> return range(0.0, 2.0)
            "lowCutVoltageV" -> return range(8.0, 12.0)'''
              ),
              (
                  '''            powerLimitW = obj.optNullableDouble("powerLimitW"),
            etaAveragingSeconds = obj.optNullableDouble("etaAveragingSeconds"),''',
                  '''            powerLimitW = obj.optNullableDouble("powerLimitW"),
            powerStateDeadzoneW = obj.optNullableDouble("powerStateDeadzoneW"),
            energyDeadzoneW = obj.optNullableDouble("energyDeadzoneW"),
            etaAveragingSeconds = obj.optNullableDouble("etaAveragingSeconds"),'''
              ),
              (
                  '''            EditableNumberSetting(
                "Лимит мощности",
                "Мощность разряда, при превышении которой отключается выход.",
                "powerLimitW",
                settings.powerLimitW,
                "W",
                20.0,
                300.0,
                100.0,
                0,
                onSetSetting
            )
            EditableNumberSetting(
                "Нижний порог напряжения",''',
                  '''            EditableNumberSetting(
                "Лимит мощности",
                "Мощность разряда, при превышении которой отключается выход.",
                "powerLimitW",
                settings.powerLimitW,
                "W",
                20.0,
                300.0,
                100.0,
                0,
                onSetSetting
            )
            EditableNumberSetting(
                "Мёртвая зона режима",
                "Порог мощности для определения режима: заряд, разряд или простой.",
                "powerStateDeadzoneW",
                settings.powerStateDeadzoneW,
                "W",
                0.0,
                20.0,
                2.0,
                2,
                onSetSetting
            )
            EditableNumberSetting(
                "Мёртвая зона учёта энергии",
                "Мощность ниже этого порога не учитывается в накопленной энергии и SoC.",
                "energyDeadzoneW",
                settings.energyDeadzoneW,
                "W",
                0.0,
                2.0,
                0.05,
                2,
                onSetSetting
            )
            EditableNumberSetting(
                "Нижний порог напряжения",'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit app changes and remove temporary workflow
        run: |
          rm .github/workflows/patch-power-deadzones.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/powerstation/MainActivity.kt .github/workflows/patch-power-deadzones.yml
          git commit -m "Add configurable power deadzones to settings [skip ci]"
          git push origin feature
