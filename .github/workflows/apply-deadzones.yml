name: Patch app deadzone settings

on:
  push:
    branches:
      - feature

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Patch MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/example/powerstation/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "    val powerLimitW: Double?,\n    val etaAveragingSeconds: Double?,",
                  "    val powerLimitW: Double?,\n    val powerStateDeadzoneW: Double?,\n    val energyDeadzoneW: Double?,\n    val etaAveragingSeconds: Double?,",
              ),
              (
                  '            "powerLimitW" -> return range(20.0, 300.0)\n            "lowCutVoltageV" -> return range(8.0, 12.0)',
                  '            "powerLimitW" -> return range(20.0, 300.0)\n            "powerStateDeadzoneW" -> return range(0.0, 20.0)\n            "energyDeadzoneW" -> return range(0.0, 2.0)\n            "lowCutVoltageV" -> return range(8.0, 12.0)',
              ),
              (
                  '            powerLimitW = obj.optNullableDouble("powerLimitW"),\n            etaAveragingSeconds = obj.optNullableDouble("etaAveragingSeconds"),',
                  '            powerLimitW = obj.optNullableDouble("powerLimitW"),\n            powerStateDeadzoneW = obj.optNullableDouble("powerStateDeadzoneW"),\n            energyDeadzoneW = obj.optNullableDouble("energyDeadzoneW"),\n            etaAveragingSeconds = obj.optNullableDouble("etaAveragingSeconds"),',
              ),
              (
                  '            EditableNumberSetting(\n                "Нижний порог напряжения",',
                  '            EditableNumberSetting(\n                "Мёртвая зона режима",\n                "Порог мощности для определения режима: заряд, разряд или простой.",\n                "powerStateDeadzoneW",\n                settings.powerStateDeadzoneW,\n                "W",\n                0.0,\n                20.0,\n                2.0,\n                2,\n                onSetSetting\n            )\n            EditableNumberSetting(\n                "Мёртвая зона учёта энергии",\n                "Мощность ниже этого порога не учитывается в накопленной энергии и SoC.",\n                "energyDeadzoneW",\n                settings.energyDeadzoneW,\n                "W",\n                0.0,\n                2.0,\n                0.05,\n                2,\n                onSetSetting\n            )\n            EditableNumberSetting(\n                "Нижний порог напряжения",',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match, got {count}: {old[:60]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          rm .github/workflows/apply-deadzones.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/powerstation/MainActivity.kt .github/workflows/apply-deadzones.yml
          git commit -m "Add configurable power deadzones to settings [skip ci]"
          git push origin feature
